local_backend: true

backend:
  name: proxy
  proxy_url: http://localhost:8081/api/v1
  branch: main

# Production GitHub backend, enable this block when the site has GitHub OAuth.
# backend:
#   name: github
#   repo: your-org/may-hai-anh
#   branch: main
#   base_url: https://your-oauth-service.example.com
#   auth_endpoint: auth

publish_mode: editorial_workflow
media_folder: "src/assets"
public_folder: "src/assets"
locale: "vi"

collections:
  - name: "product_categories"
    label: "Danh mục sản phẩm"
    folder: "src/content/product-categories"
    create: true
    identifier_field: "name"
    slug: "{{slug}}"
    fields:
      - { label: "Tên danh mục", name: "name", widget: "string" }
      - { label: "Mô tả", name: "description", widget: "text" }
      - { label: "Thứ tự", name: "order", widget: "number", value_type: "int" }
  - name: "products"
    label: "Sản phẩm"
    folder: "src/content/products"
    create: true
    identifier_field: "name"
    slug: "{{slug}}"
    fields:
      - { label: "Tên sản phẩm", name: "name", widget: "string" }
      - label: "Danh mục"
        name: "category"
        widget: "relation"
        collection: "product_categories"
        search_fields: ["name"]
        value_field: "name"
        display_fields: ["name"]
      - { label: "Meta description", name: "description", widget: "text" }
      - { label: "Ảnh", name: "image", widget: "image" }
      - { label: "Alt text ảnh", name: "imageAlt", widget: "string" }
      - { label: "SEO Checker", name: "seoCheck", widget: "seo_checker", required: false }
      - { label: "Nội dung", name: "body", widget: "markdown" }
  - name: "blog"
    label: "Tin tức"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Tiêu đề", name: "title", widget: "string" }
      - { label: "Ngày", name: "date", widget: "datetime" }
      - { label: "Meta description", name: "description", widget: "text" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Ảnh cover", name: "coverImage", widget: "image" }
      - { label: "Alt text ảnh cover", name: "coverImageAlt", widget: "string" }
      - { label: "Tags", name: "tags", widget: "list" }
      - { label: "SEO Checker", name: "seoCheck", widget: "seo_checker", required: false }
      - { label: "Nội dung", name: "body", widget: "markdown" }
  - name: "factories"
    label: "Nhà máy"
    folder: "src/content/factories"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Tên nhà máy", name: "name", widget: "string" }
      - { label: "Địa chỉ", name: "address", widget: "string" }
      - { label: "Thứ tự", name: "order", widget: "number", value_type: "int" }
